<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.css">
  <!-- --------------------------------------------------------------------------------------------- -->
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;600;700&display=swap" rel="stylesheet" />
  <!-- ---------------------------------------------------------------------------------------------= -->
  <link rel="stylesheet" href="style.css">
  <title> Ping coming soon page</title>
</head>

<body>
  <main class="container">
    <!-- Logo -->
    <header class="logo">
      <h1>PING<span>.</span></h1>
    </header>


    <section class="intro">
      <h2>We are launching <span>soon!</span></h2>
      <p>Subscribe and get notified</p>
    </section>

    <!-- Form Section -->
    <form class="subscribe-form" id="subscribeForm" novalidate>
      <div class="input-group">
        <input type="email" id="emailInput" placeholder="Your email address..." aria-label="Your email address">
        <span class="error-msg" id="errorMsg">Please provide a valid email address</span>
      </div>
      <button type="submit">Notify Me</button>
    </form>

    <!-- Dashboard Illustration -->
    <div class="dashboard-img">
      <img src="images/illustration-dashboard.png" alt="Dashboard Preview">
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="social-links">
      <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
      <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://github.com/drmazenaskar-blip" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
    </div>
    <p class="copyright">&copy; Copyright Ping. All rights reserved.</p>
  </footer>



  <script src=script.js></script>
</body>

</html>
